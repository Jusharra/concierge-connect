[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# 301 redirects for URLs that used to exist and no longer resolve.
# More are generated at build time from Airtable "Page Registry" rows whose
# Status is "Redirected" (see scripts/postbuild.ts -> dist/_redirects).
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/private-air/private-jet-charter-las-vegas"
  to = "/private-air/"
  status = 301
  force = true

[[redirects]]
  from = "/private-air/private-jet-charter-aspen"
  to = "/private-air/"
  status = 301
  force = true

[[redirects]]
  from = "/yachts/day-yacht-charter-miami"
  to = "/yachts/yacht-charter-miami/"
  status = 301
  force = true

[[redirects]]
  from = "/exotic-cars/exotic-car-rental-monaco"
  to = "/exotic-cars/"
  status = 301
  force = true

# Services is served by the existing /access page.
[[redirects]]
  from = "/services"
  to = "/access/"
  status = 301
  force = true

# Real 404s: there is intentionally no "/* -> /index.html" SPA fallback.
# Unknown URLs get dist/404.html with HTTP 404.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
